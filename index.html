  #panel h2 { font-size: 19px; font-weight: 600; color: var(--accent); margin-bottom: 14px; letter-spacing: 0.03em; }

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* =====================================================================
   IT 360 Digital Forensics Lab Realm
   Reads Syllabus.md at runtime (never modifies it) and rebuilds the lab
   whenever the file changes. One forensic workstation per ### section.
   ===================================================================== */

const SYLLABUS_URL = 'Syllabus.md';
const POLL_MS = 3000;
const ROOM_RADIUS = 22;
const STATION_RADIUS = 13;
const READ_DISTANCE = 4.2;

const ACCENTS = [0x35e0c8, 0x5ab0ff, 0xffb454, 0xff6e9c, 0x9d7bff, 0x7dff8a, 0xff8a5c, 0x59e0ff];
const STATION_PROPS = ['evidence', 'rack', 'scope', 'locker', 'drive', 'antenna', 'evidence', 'rack'];

/* ---------------- markdown parsing (read-only) ---------------- */

function parseSyllabus(md) {
  const lines = md.split(/\r?\n/);
  const intro = { title: 'Digital Forensics Lab', meta: [] };
  const sections = [];
  let current = null;
  for (const line of lines) {
    const h3 = line.match(/^###\s+(.*)/);
    const h2 = line.match(/^##\s+([^#].*)/);
    if (h3) { current = { title: h3[1].trim(), body: [] }; sections.push(current); continue; }
    if (!current && h2) { intro.title = h2[1].trim(); continue; }
    if (current) current.body.push(line);
    else if (line.trim() && !/^---+$/.test(line.trim())) intro.meta.push(line.trim());
  }
  return { intro, sections };
}

function inlineMd(s) {
  return s
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, '<a href="$1" target="_blank">$1</a>')
    .replace(/&lt;([\w.+-]+@[\w.-]+)&gt;/g, '<a href="mailto:$1">$1</a>');
}

function mdBlockToHtml(lines) {
  const out = [];
  let list = null, table = null;
  const flushList = () => { if (list) { out.push('<ul>' + list.join('') + '</ul>'); list = null; } };
  const flushTable = () => {
    if (!table) return;
    let html = '<table>';
    table.forEach((row, i) => {
      if (row.every(c => /^:?-{2,}:?$/.test(c.trim()))) return;
      const tag = i === 0 ? 'th' : 'td';
      html += '<tr>' + row.map(c => `<${tag}>${inlineMd(c.trim())}</${tag}>`).join('') + '</tr>';
    });
    out.push(html + '</table>');
    table = null;
  };
  for (const raw of lines) {
    const line = raw.trimEnd();
    const t = line.trim();
    if (t.startsWith('|')) {
      flushList();
      if (!table) table = [];
      table.push(t.replace(/^\|/, '').replace(/\|$/, '').split('|'));
      continue;
    }
    flushTable();
    if (!t) { flushList(); continue; }
    if (/^---+$/.test(t)) { flushList(); out.push('<hr>'); continue; }
    const h4 = t.match(/^####\s+(.*)/);
    if (h4) { flushList(); out.push('<h3>' + inlineMd(h4[1]) + '</h3>'); continue; }
    if (t.startsWith('>')) { flushList(); out.push('<blockquote>' + inlineMd(t.replace(/^>\s?/, '')) + '</blockquote>'); continue; }
    const li = t.match(/^[*-]\s+(.*)/);
    if (li) { if (!list) list = []; list.push('<li>' + inlineMd(li[1]) + '</li>'); continue; }
    flushList();
    out.push('<p>' + inlineMd(t) + '</p>');
  }
  flushList(); flushTable();
  return out.join('\n');
}

/* short plain-text preview lines for the 3D monitor screens */
function previewLines(bodyLines, max = 7) {
  const res = [];
  for (const raw of bodyLines) {
    const t = raw.trim();
    if (!t || /^---+$/.test(t) || t.startsWith('|')) continue;
    let s = t.replace(/^####\s+/, '').replace(/^[*->]\s*/, '• ').replace(/^•\s*>?\s*/, '• ')
             .replace(/\*\*/g, '').replace(/\*/g, '').replace(/`/g, '');
    if (s.length > 46) s = s.slice(0, 44) + '…';
    res.push(s);
    if (res.length >= max) break;
  }
  return res;
}

/* ---------------- three.js scene ---------------- */

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04070b);
scene.fog = new THREE.Fog(0x04070b, 18, 46);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 120);
camera.position.set(0, 1.7, 6);

const controls = new PointerLockControls(camera, document.body);

/* lighting */
scene.add(new THREE.HemisphereLight(0x8fb4c9, 0x0a0f14, 0.85));
const ceil = new THREE.PointLight(0x9fdcff, 60, 40, 1.8);
ceil.position.set(0, 7.5, 0);
scene.add(ceil);

/* floor: dark tiles + glow grid */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(ROOM_RADIUS + 2, 64),
  new THREE.MeshStandardMaterial({ color: 0x0b1218, roughness: 0.85, metalness: 0.25 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);
const grid = new THREE.GridHelper(ROOM_RADIUS * 2 + 4, 44, 0x1d3a44, 0x122129);
grid.position.y = 0.01;
scene.add(grid);

/* perimeter wall — dark cylinder with faint panel lines */
const wall = new THREE.Mesh(
  new THREE.CylinderGeometry(ROOM_RADIUS + 2, ROOM_RADIUS + 2, 9, 64, 1, true),
  new THREE.MeshStandardMaterial({ color: 0x0a1219, roughness: 0.9, side: THREE.BackSide })
);
wall.position.y = 4.5;
scene.add(wall);
const wallGlow = new THREE.Mesh(
  new THREE.CylinderGeometry(ROOM_RADIUS + 1.95, ROOM_RADIUS + 1.95, 0.1, 64, 1, true),
  new THREE.MeshBasicMaterial({ color: 0x35e0c8, side: THREE.BackSide })
);
wallGlow.position.y = 2.6;
scene.add(wallGlow);

/* ---------------- canvas-texture helpers ---------------- */

function makeScreenTexture(title, lines, accentHex, index) {
  const c = document.createElement('canvas');
  c.width = 640; c.height = 400;
  const g = c.getContext('2d');
  const accent = '#' + accentHex.toString(16).padStart(6, '0');
  g.fillStyle = '#060d12'; g.fillRect(0, 0, 640, 400);
  /* scanlines */
  g.fillStyle = 'rgba(255,255,255,0.022)';
  for (let y = 0; y < 400; y += 4) g.fillRect(0, y, 640, 1);
  /* header */
  g.fillStyle = accent; g.fillRect(0, 0, 640, 6);
  g.font = '600 15px monospace'; g.fillStyle = 'rgba(255,255,255,0.45)';
  g.fillText('STATION ' + String(index + 1).padStart(2, '0') + ' // CASE FILE', 24, 40);
  g.font = '700 27px "Segoe UI", sans-serif'; g.fillStyle = accent;
  wrapText(g, title.toUpperCase(), 24, 78, 592, 32, 2);
  g.strokeStyle = 'rgba(255,255,255,0.15)';
  g.beginPath(); g.moveTo(24, 128); g.lineTo(616, 128); g.stroke();
  /* body preview */
  g.font = '17px monospace'; g.fillStyle = '#bfe3ec';
  lines.forEach((s, i) => g.fillText(s, 24, 160 + i * 30));
  g.font = '600 14px monospace'; g.fillStyle = accent;
  g.fillText('[ E ] OPEN FULL CASE FILE', 24, 378);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function wrapText(g, text, x, y, maxW, lh, maxLines) {
  const words = text.split(' ');
  let line = '', ln = 0;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line) {
      g.fillText(line, x, y + ln * lh);
      if (++ln >= maxLines - 1) { line = w; break; }
      line = w;
    } else line = test;
  }
  g.fillText(line, x, y + ln * lh);
}

function makeHologramTexture(title, metaLines) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 1024, 512);
  g.textAlign = 'center';
  g.font = '700 44px "Segoe UI", sans-serif';
  g.fillStyle = '#7df5e4';
  g.shadowColor = '#35e0c8'; g.shadowBlur = 24;
  wrapCenter(g, title, 512, 150, 900, 54);
  g.font = '24px monospace'; g.fillStyle = '#bdeef2'; g.shadowBlur = 10;
  metaLines.slice(0, 5).forEach((m, i) => {
    g.fillText(m.replace(/\*\*/g, '').replace(/[<>]/g, '').slice(0, 70), 512, 300 + i * 40);
  });
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function wrapCenter(g, text, x, y, maxW, lh) {
  const words = text.split(' ');
  let line = '', ln = 0;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y + ln * lh); ln++; line = w; }
    else line = test;
  }
  g.fillText(line, x, y + ln * lh);
}

/* ---------------- forensic props ---------------- */

function buildProp(kind, accent) {
  const grp = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({ color: 0x1a242c, roughness: 0.6, metalness: 0.6 });
  const glow = new THREE.MeshBasicMaterial({ color: accent });
  if (kind === 'rack') {
    const rack = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2.1, 0.7), metal);
    rack.position.y = 1.05; grp.add(rack);
    for (let i = 0; i < 6; i++) {
      const led = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.04, 0.02), glow.clone());
      led.position.set(0.28 - (i % 2) * 0.56, 0.4 + Math.floor(i / 2) * 0.55, 0.36);
      led.userData.blink = Math.random() * Math.PI * 2;
      grp.add(led);
    }
  } else if (kind === 'evidence') {
    for (let i = 0; i < 3; i++) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.3, 0.4),
        new THREE.MeshStandardMaterial({ color: 0x223038, roughness: 0.8 }));
      box.position.set((i - 1) * 0.12, 0.15 + i * 0.32, i * 0.05);
      box.rotation.y = (i - 1) * 0.25;
      grp.add(box);
      const tag = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.12), glow.clone());
      tag.position.set(box.position.x, box.position.y, box.position.z + 0.21);
      tag.rotation.y = box.rotation.y;
      grp.add(tag);
    }
  } else if (kind === 'scope') {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 1.4, 12), metal);
    pole.position.y = 0.7; grp.add(pole);
    const dish = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x223038, metalness: 0.7, roughness: 0.4, side: THREE.DoubleSide }));
    dish.position.y = 1.45; dish.rotation.x = Math.PI; grp.add(dish);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), glow.clone());
    dot.position.y = 1.5; dot.userData.blink = 0; grp.add(dot);
  } else if (kind === 'locker') {
    const lk = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.9, 0.55), metal);
    lk.position.y = 0.95; grp.add(lk);
    for (let i = 0; i < 3; i++) {
      const stripe = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.03), glow.clone());
      stripe.position.set(0, 0.45 + i * 0.6, 0.29);
      grp.add(stripe);
    }
  } else if (kind === 'drive') {
    for (let i = 0; i < 4; i++) {
      const d = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.7), metal.clone());
      d.position.y = 0.08 + i * 0.16;
      grp.add(d);
      const led = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.02), glow.clone());
      led.position.set(0.18, d.position.y, 0.36);
      led.userData.blink = i * 1.3;
      grp.add(led);
    }
  } else if (kind === 'antenna') {
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 0.25, 16), metal);
    base.position.y = 0.12; grp.add(base);
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 1.8, 8), metal);
    mast.position.y = 1.1; grp.add(mast);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.015, 8, 24), glow.clone());
    ring.position.y = 1.9; ring.rotation.x = Math.PI / 2;
    ring.userData.pulseRing = true;
    grp.add(ring);
  }
  return grp;
}

/* ---------------- station construction ---------------- */

let stationGroup = new THREE.Group();
scene.add(stationGroup);
let hologramGroup = new THREE.Group();
scene.add(hologramGroup);
let stations = []; // { pos: Vector3, title, html, index }
let blinkers = [];
let holoBillboard = null;

function clearRealm() {
  [stationGroup, hologramGroup].forEach(gr => {
    gr.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); }
    });
    scene.remove(gr);
  });
  stationGroup = new THREE.Group(); scene.add(stationGroup);
  hologramGroup = new THREE.Group(); scene.add(hologramGroup);
  stations = []; blinkers = []; holoBillboard = null;
}

function buildRealm(md) {
  clearRealm();
  const { intro, sections } = parseSyllabus(md);

  /* central hologram — course header, billboards toward the player */
  const holoTex = makeHologramTexture(intro.title, intro.meta);
  const holoMat = new THREE.MeshBasicMaterial({ map: holoTex, transparent: true, depthWrite: false });
  holoBillboard = new THREE.Mesh(new THREE.PlaneGeometry(7, 3.5), holoMat);
  holoBillboard.position.y = 3.2;
  hologramGroup.add(holoBillboard);
  const pedestal = new THREE.Mesh(
    new THREE.CylinderGeometry(1.3, 1.6, 0.5, 32),
    new THREE.MeshStandardMaterial({ color: 0x14202a, metalness: 0.7, roughness: 0.35 })
  );
  pedestal.position.y = 0.25; hologramGroup.add(pedestal);
  const pedRing = new THREE.Mesh(new THREE.TorusGeometry(1.45, 0.04, 8, 48),
    new THREE.MeshBasicMaterial({ color: 0x35e0c8 }));
  pedRing.rotation.x = Math.PI / 2; pedRing.position.y = 0.52;
  hologramGroup.add(pedRing);
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.9, 1.25, 4.6, 24, 1, true),
    new THREE.MeshBasicMaterial({ color: 0x35e0c8, transparent: true, opacity: 0.06, side: THREE.DoubleSide, depthWrite: false })
  );
  beam.position.y = 2.8; hologramGroup.add(beam);

  /* one workstation per section, ring layout */
  const n = Math.max(sections.length, 1);
  sections.forEach((sec, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
    const accent = ACCENTS[i % ACCENTS.length];
    const st = new THREE.Group();
    const px = Math.cos(angle) * STATION_RADIUS;
    const pz = Math.sin(angle) * STATION_RADIUS;
    st.position.set(px, 0, pz);
    st.rotation.y = -angle - Math.PI / 2; /* face center */

    const metal = new THREE.MeshStandardMaterial({ color: 0x18232c, metalness: 0.65, roughness: 0.4 });
    /* desk */
    const desk = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.09, 1.1), metal);
    desk.position.y = 0.95; st.add(desk);
    [-1.1, 1.1].forEach(x => {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.95, 0.9), metal);
      leg.position.set(x, 0.48, 0); st.add(leg);
    });
    /* accent light strip under desk */
    const strip = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.03, 0.03), new THREE.MeshBasicMaterial({ color: accent }));
    strip.position.set(0, 0.9, 0.56); st.add(strip);

    /* monitor with section preview */
    const tex = makeScreenTexture(sec.title, previewLines(sec.body), accent, i);
    const screen = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.375),
      new THREE.MeshBasicMaterial({ map: tex }));
    screen.position.set(0, 1.95, -0.28);
    screen.rotation.x = -0.06;
    st.add(screen);
    const bezel = new THREE.Mesh(new THREE.BoxGeometry(2.32, 1.5, 0.07), metal);
    bezel.position.set(0, 1.95, -0.33); bezel.rotation.x = -0.06; st.add(bezel);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.55, 8), metal);
    arm.position.set(0, 1.25, -0.35); st.add(arm);

    /* station point light */
    const pl = new THREE.PointLight(accent, 14, 9, 1.9);
    pl.position.set(0, 3.1, 0.8); st.add(pl);

    /* flavor prop beside desk */
    const prop = buildProp(STATION_PROPS[i % STATION_PROPS.length], accent);
    prop.position.set(1.9, 0, -0.2);
    st.add(prop);

    /* floor marker ring */
    const ring = new THREE.Mesh(new THREE.RingGeometry(1.55, 1.7, 40),
      new THREE.MeshBasicMaterial({ color: accent, transparent: true, opacity: 0.35, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.02;
    st.add(ring);

    stationGroup.add(st);
    st.traverse(o => { if (o.userData.blink !== undefined || o.userData.pulseRing) blinkers.push(o); });

    stations.push({
      pos: new THREE.Vector3(px, 0, pz),
      title: sec.title,
      html: mdBlockToHtml(sec.body),
      index: i,
    });
  });

  document.getElementById('startSub').textContent =
    intro.title + ' — ' + sections.length + ' stations online';
}

/* ---------------- syllabus fetch + live reload ---------------- */

let lastText = null;
async function fetchSyllabus(first) {
  try {
    const r = await fetch(SYLLABUS_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    if (text !== lastText) {
      lastText = text;
      buildRealm(text);
      if (!first) toast('⟳ Syllabus updated — lab rebuilt');
    }
  } catch (e) {
    if (first) {
      const err = document.getElementById('startErr');
      err.style.display = 'block';
      err.textContent = 'Could not load Syllabus.md (' + e.message +
        '). Serve this folder over HTTP, e.g.:  python3 -m http.server  — then open http://localhost:8000/';
      document.getElementById('startSub').textContent = 'Case files unavailable';
    }
  }
}
fetchSyllabus(true);
setInterval(() => fetchSyllabus(false), POLL_MS);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.style.opacity = 0), 2600);
}

/* ---------------- input & movement ---------------- */

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyE') toggleRead();
});
addEventListener('keyup', e => (keys[e.code] = false));

const startEl = document.getElementById('start');
startEl.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => {
  startEl.style.display = 'none';
  document.getElementById('crosshair').style.display = 'block';
});
controls.addEventListener('unlock', () => {
  if (panelEl.style.display !== 'block') startEl.style.display = 'flex';
  document.getElementById('crosshair').style.display = 'none';
});

const panelEl = document.getElementById('panel');
const hintEl = document.getElementById('hint');
let nearStation = null;

function toggleRead() {
  if (panelEl.style.display === 'block') { panelEl.style.display = 'none'; return; }
  if (!nearStation) return;
  panelEl.innerHTML =
    '<div class="station-tag">Station ' + String(nearStation.index + 1).padStart(2, '0') +
    ' · Case File</div><h2>' + inlineMd(nearStation.title) + '</h2>' + nearStation.html;
  panelEl.style.display = 'block';
  panelEl.scrollTop = 0;
}

/* ---------------- animation loop ---------------- */

const vel = new THREE.Vector3();
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  if (controls.isLocked) {
    const speed = 5.2;
    vel.set(0, 0, 0);
    if (keys.KeyW) vel.z += 1;
    if (keys.KeyS) vel.z -= 1;
    if (keys.KeyA) vel.x -= 1;
    if (keys.KeyD) vel.x += 1;
    if (vel.lengthSq() > 0) {
      vel.normalize().multiplyScalar(speed * dt);
      controls.moveForward(vel.z);
      controls.moveRight(vel.x);
    }
    /* keep inside the room */
    const p = camera.position;
    const d = Math.hypot(p.x, p.z);
    const maxD = ROOM_RADIUS - 0.6;
    if (d > maxD) { p.x *= maxD / d; p.z *= maxD / d; }
    p.y = 1.7;
  }

  /* proximity check */
  nearStation = null;
  let best = READ_DISTANCE;
  for (const s of stations) {
    const d = Math.hypot(camera.position.x - s.pos.x, camera.position.z - s.pos.z);
    if (d < best) { best = d; nearStation = s; }
  }
  hintEl.style.display = nearStation && controls.isLocked && panelEl.style.display !== 'block' ? 'block' : 'none';
  if (!nearStation && panelEl.style.display === 'block') panelEl.style.display = 'none';

  /* idle animation */
  if (holoBillboard) {
    holoBillboard.rotation.y = Math.atan2(camera.position.x, camera.position.z);
    holoBillboard.position.y = 3.2 + 0.12 * Math.sin(t * 1.2);
  }
  for (const b of blinkers) {
    if (b.userData.pulseRing) {
      const s = 1 + 0.25 * Math.sin(t * 3);
      b.scale.set(s, s, 1);
      b.material.opacity = 0.7 + 0.3 * Math.sin(t * 3);
      b.material.transparent = true;
    } else {
      b.visible = Math.sin(t * 4 + b.userData.blink) > -0.3;
    }
  }

  renderer.render(scene, camera);
}
animate();

/* debug/test hook */
window.__lab = { camera, get stations() { return stations; } };

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
